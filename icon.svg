  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <!-- open book: two pages -->
  <path d="M32 16c-5-4-12-5-19-4v34c7-1 14 0 19 4 5-4 12-5 19-4V12c-7-1-14 0-19 4z" fill="url(#page)"/>
