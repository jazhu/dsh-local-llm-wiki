  <!-- text lines left page -->
  <g stroke="#4a6b5a" stroke-width="2" stroke-linecap="round">
    <path d="M17 22h10"/>
    <path d="M17 28h10"/>
    <path d="M17 34h7"/>
    <!-- text lines right page -->
    <path d="M37 22h10"/>
    <path d="M37 28h10"/>
    <path d="M37 34h7"/>
  </g>
  <!-- knowledge node link on top -->
  <circle cx="32" cy="10" r="3.2" fill="#ffd66b"/>
  <path d="M32 13v3" stroke="#ffd66b" stroke-width="2" stroke-linecap="round"/>
</svg>
